name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is here so that adding the `run-slow` label to an open pull
    # request re-runs the workflow and picks up the slow job. Without it the
    # label would only take effect on the next push.
    types: [opened, synchronize, reopened, labeled]
  # Lets the slow job be run on demand against any branch, which is the escape
  # hatch for a change that looks risky before it is merged.
  workflow_dispatch:

# Nothing here writes to the repository, so ask for no more than reading it.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless, so
# cancel it. Runs on main are left alone: main's history is the record of what
# was actually verified, and a cancelled run leaves a hole in it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # matplotlib must never try to open a window on a headless runner. conftest.py
  # also forces Agg, but the experiments are run outside pytest by the slow job,
  # so the guarantee belongs at the workflow level as well.
  MPLBACKEND: Agg

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite takes about five minutes. Twenty is enough headroom for a slow
    # runner while still killing a hang rather than burning the full six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml and a current release. Testing
        # both ends catches the syntax and typing differences that matter;
        # testing every version in between would only buy CI minutes' worth of
        # nothing. Add 3.13 once the scientific stack here is settled on it.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The default only hashes requirements.txt, so a change to the dev
          # pins or to the project metadata would silently reuse a stale cache.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite with coverage
        # The marker expression is spelled out rather than left to the addopts
        # in pyproject.toml, so that reading this file tells you what actually
        # ran. `slow` is excluded to keep pull-request feedback quick; the slow
        # job below covers it. `network` is excluded because a test suite that
        # depends on the network is a test suite that fails for reasons that
        # have nothing to do with the change under test.
        run: |
          python -m pytest -q \
            -m "not slow and not network" \
            --cov=fintech \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Publish the coverage summary
        # Runs even when the tests fail, because the coverage of a failing run
        # is still the quickest way to see which module was not exercised.
        if: always() && matrix.python-version == '3.12'
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            python -m coverage report --rcfile=.coveragerc
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage data as an artefact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  slow:
    name: Slow tests and the full experiment
    runs-on: ubuntu-latest
    # Measured locally: the slow-marked tests take about ten seconds and
    # `python -m experiments.smith1962` takes a little over three minutes. With
    # the install on top, a run is under six minutes; twenty-five leaves room
    # for a runner having a bad day without letting a hang run for hours.
    timeout-minutes: 25
    # This is the trade-off. The expensive part is the full Smith replication,
    # which costs minutes on every run, and the market code it exercises is the
    # part of the repository that changes least often. Running it on every pull
    # request would slow the ordinary loop for a payoff that arrives on maybe
    # one push in twenty, so by default it runs on pushes to main, where a
    # regression is caught within minutes of merging rather than at the end of
    # the project. When a change does touch the market or the schedules, label
    # the pull request `run-slow` (or trigger the workflow by hand) and it runs
    # before the merge instead of after it.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-slow')

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # One version only. This job exists to exercise the experiments, not
          # to re-check portability, which the matrix above already does.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the slow tests
        run: python -m pytest -q -m "slow and not network" --durations=10

      - name: Run the full Smith 1962 replication
        # The slow-marked tests are quick sanity checks on the sweep helpers.
        # This is the thing they stand in for: the whole experiment, at the
        # session count and length the write-up actually quotes. If it stops
        # converging, or stops running at all, this is where that shows up.
        run: python -m experiments.smith1962

      - name: Keep the figures it produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smith1962-figures
          path: figures/*.png
          if-no-files-found: error
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # No pip cache here on purpose: this job installs exactly one small
          # pinned wheel, and restoring and saving a cache costs more than
          # downloading it.
      # Pinned deliberately. ruff's formatter gained the ability to reformat
      # fenced Python inside Markdown, which broke this job on a release that
      # had nothing to do with any change here. Bump it on purpose, not by
      # surprise.
      - run: pip install ruff==0.16.3
      - run: ruff check fintech tests experiments
      - run: ruff format --check fintech tests experiments
