name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned deliberately. ruff's formatter gained the ability to reformat
      # fenced Python inside Markdown, which broke this job on a release that
      # had nothing to do with any change here. Bump it on purpose, not by
      # surprise.
      - run: pip install ruff==0.16.3
      - run: ruff check fintech tests experiments
      - run: ruff format --check fintech tests experiments
